/**
 * Generates the theme with sass into gensrc/themes
 * A plain css theme (like bcd-css) is bundled and minified with esbuild instead
 */
import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

plugins {
  id "com.github.node-gradle.node"
}

def themeName         = project.properties['bcdui.theme.name']
def themeFullLocation = file(project.properties['bcdui.theme.location'] + '/' + themeName).absolutePath
def rootFolder = file(new File("$themeFullLocation/.genericBased")).exists() ? "generic" : "bcd"

// bcd-css is a plain css theme with its entry allStyles.css in its root and no sass, it is self-contained (not based on src/bcd)
def isCssTheme = themeName == "bcd-css"


//*********************************************
// Compile Scss into css
task bcduiThemeCompileScss( type: NodeTask, dependsOn: ':bcduiNodeJsTools' ) {

  onlyIf { !isCssTheme }

  def taskDestDirName = "$buildDir/tmp/${themeName}_tmp_CompileCss"

  inputs.dir  file(themeFullLocation)
  inputs.dir  file("src/" + rootFolder)
  outputs.dir file(taskDestDirName)

  script = file("$nodeModulesDir/sass/sass.js")
  args   = [ '--quiet', '--style=compressed', "$themeFullLocation/css/${themeName}.scss", "$taskDestDirName/css/${themeName}.css" ]
}

//*********************************************
// Minify css provided in allStyles.css
task bcduiCleanCss( type: NodeTask, dependsOn: ':bcduiNodeJsTools' ) {

  onlyIf { !isCssTheme }
  dependsOn bcduiThemeCompileScss

  // We keep the original level of nesting to let any relative urls in @import outside survive
  def taskDestDirName = "$buildDir/tmp/${themeName}_tmp_CleanCss"
  inputs.files   bcduiThemeCompileScss.outputs.files
  outputs.files "$taskDestDirName/css/allStyles-min.css"

  // Take all user-provided css, those being generated from scss are already there from bcduiThemeCompileScss
  doFirst{
    copy {
      from themeFullLocation
      into taskDestDirName
      include "**/*.css"
      includeEmptyDirs = false
    }
    copy {
      from bcduiThemeCompileScss
      into taskDestDirName
      includeEmptyDirs = false
    }
  }

  script = file("$nodeModulesDir/clean-css-cli/bin/cleancss")
  args   = [ "$taskDestDirName/css/allStyles.css", "--output", "$taskDestDirName/css/allStyles-min.css"]
}

//*********************************************
// Plain css theme: bundle allStyles.css with all its @imports into a single minified css/allStyles.css.
// clean-css cannot be used here, it does not understand css nesting.
// url() targets are copied with their relative location kept ([dir]/[name]), so the urls stay valid from css/.
// Legacy FontAwesome font formats (eot, woff, svg) are referenced by its css but not part of the theme, they stay external.
// Optional bcd-ui-de.css next to allStyles.css holds the styles for BCD-UI-DE, it becomes css/bcd-ui-de.css.
def bcduiThemeBundleCssDir = "$buildDir/tmp/${themeName}_tmp_BundleCss"
def bcduiThemeBundleCssEntries = [ "allStyles.css", "bcd-ui-de.css" ].findAll { file("$themeFullLocation/$it").exists() }.collect { "$themeFullLocation/$it" }
def bcduiThemeBundleCssArgs = bcduiThemeBundleCssEntries + [ "--bundle", "--minify",
  "--loader:.gif=copy", "--loader:.png=copy", "--loader:.jpg=copy", "--loader:.svg=copy", "--loader:.woff2=copy", "--loader:.ttf=copy",
  "--external:*.eot", "--external:*#iefix", "--external:*.woff", "--external:*#fontawesome",
  "--asset-names=[dir]/[name]", "--entry-names=css/[name]", "--outdir=$bcduiThemeBundleCssDir" ]

// bin/esbuild is a NodeJs wrapper for windows but comes as a binary for MAC
task bcduiThemeBundleCss( type: DefaultNativePlatform.currentOperatingSystem.isWindows() ? NodeTask : Exec, dependsOn: ':bcduiNodeJsTools' ) {

  onlyIf { isCssTheme }

  inputs.dir  file(themeFullLocation)
  outputs.dir file(bcduiThemeBundleCssDir)

  doFirst { delete bcduiThemeBundleCssDir }

  if( DefaultNativePlatform.currentOperatingSystem.isWindows() ) {
    script = file("$nodeModulesDir/esbuild/bin/esbuild")
    args   = bcduiThemeBundleCssArgs
  } else {
    commandLine( [ file("$nodeModulesDir/esbuild/bin/esbuild") ] + bcduiThemeBundleCssArgs )
  }
}


//******************************
// Collect files for theme into build/distributions/<themeName>
task bcduiThemeDistCollect ( type: Copy ) {
  description 'Fill ./build/themes/<themeName>/WebContent'

  dependsOn isCssTheme ? bcduiThemeBundleCss : bcduiCleanCss

  // This needs to point to WebContent root folder, because outputs is used from other tasks
  def taskTargetDir = "./build/themes/$themeName/WebContent"
  into taskTargetDir

  doFirst {
    file(taskTargetDir).mkdirs()
    delete outputs
  }

  includeEmptyDirs = false

  include '**/*'
  exclude '**/*.scssc'
  exclude '**/*.scss'

  duplicatesStrategy = 'include'
  if( isCssTheme ) {
    // Plain css theme: its own files (without css sources and docu), then the bundled css/allStyles.css
    from( themeFullLocation ) {
      into 'bcdui/theme'
      exclude '**/*.css'
    }
    from( bcduiThemeBundleCss ) {
      into 'bcdui/theme'
    }
  } else {
    // First generic part, then the specific part. Then add the css generated from sass
    from( "./src/" + rootFolder ) {
      into 'bcdui/theme'
      exclude '**/*.css'
    }
    from( themeFullLocation ) {
      into 'bcdui/theme'
      exclude '**/*.css'
    }
    from( bcduiCleanCss ) {
      into 'bcdui/theme/css'
      rename { "allStyles.css" }
    }
  }
}


//******************************
// Do all for what gradle 'Theme' project is responsible for
task bcduiThemeDist( type: Jar ) {
  archiveBaseName = "$artifactsBaseName-theme-$themeName"
  archiveVersion  = bcduiVersion
  destinationDirectory = file("$buildDir/libs")
  includeEmptyDirs = false
  from bcduiThemeDistCollect
}


//******************************
// Clean artifacts
task bcduiClean( type: Delete ) {
  group "bcd-ui"
  delete buildDir
}


//************************************
task bcduiBuildTheme {
  dependsOn bcduiThemeDist
}